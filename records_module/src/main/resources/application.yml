# TODO 配置数据源相关信息

server:
  port: 81

spring:
  profiles:
    active: dev
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/record_db #?servierTimezone=UTC
    username: root
    password: root
  application:
    name: records-module
  cloud:
    consul:
      host: localhost
      port: 8500

logging:
  level:
    com.alibaba.cloud: DEBUG
    org.springframework.cloud: DEBUG
    com.alibaba.nacos: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: "beans,health"
